name: release

# A `v*` tag builds the binaries that scripts/fetch-or-build.sh downloads at `herdr plugin install`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.triple }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: macos-latest, triple: aarch64-apple-darwin, arch: arm64 }
          - { os: macos-latest, triple: x86_64-apple-darwin, arch: x86_64 }
          - { os: ubuntu-latest, triple: x86_64-unknown-linux-musl, arch: x86-64 }
          - { os: ubuntu-24.04-arm, triple: aarch64-unknown-linux-musl, arch: aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches Cargo.toml and herdr-plugin.toml
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(grep -E '^version *= *"' Cargo.toml | head -n1 | sed -E 's/^version *= *"([^"]+)".*/\1/')"
          manifest="$(grep -E '^version *= *"' herdr-plugin.toml | head -n1 | sed -E 's/^version *= *"([^"]+)".*/\1/')"
          [ "$tag" = "$crate" ] || { echo "tag $GITHUB_REF_NAME != Cargo.toml $crate" >&2; exit 1; }
          [ "$tag" = "$manifest" ] || { echo "tag $GITHUB_REF_NAME != herdr-plugin.toml $manifest" >&2; exit 1; }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - name: musl tools
        if: contains(matrix.triple, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - run: cargo build --release --locked --target ${{ matrix.triple }}

      - name: Stage asset, check its architecture
        shell: bash
        run: |
          asset="herdr-popup-resource-manager-${{ matrix.triple }}"
          mkdir -p dist
          cp "target/${{ matrix.triple }}/release/herdr-popup-resource-manager" "dist/$asset"
          # The x86_64 macOS build is cross-compiled and never run here, so check what was built.
          file "dist/$asset" | tee /dev/stderr | grep -q "${{ matrix.arch }}"
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum "$asset"; else shasum -a 256 "$asset"; fi > "$asset.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.triple }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble assets, SHA256SUMS and COMMIT
        run: |
          mkdir -p release
          find artifacts -type f -name 'herdr-popup-resource-manager-*' ! -name '*.sha256' -exec cp {} release/ \;
          cat artifacts/*/*.sha256 > release/SHA256SUMS
          printf '%s\n' "$GITHUB_SHA" > release/COMMIT
          ls -l release; cat release/SHA256SUMS

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" release/* --clobber --repo "$GITHUB_REPOSITORY"
