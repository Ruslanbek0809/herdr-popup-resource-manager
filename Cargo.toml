[package]
name = "herdr-popup-resource-manager"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Live CPU and memory popup for every herdr workspace, tab and agent pane"
license = "MIT"
authors = ["Ruslan Hasanov"]
repository = "https://github.com/Ruslanbek0809/herdr-popup-resource-manager"
readme = "README.md"
keywords = ["herdr", "tui", "ratatui", "monitor", "terminal"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "herdr_popup_resource_manager"
path = "src/lib.rs"

[[bin]]
name = "herdr-popup-resource-manager"
path = "src/main.rs"

[dependencies]
ratatui = "0.30.2"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-width = "0.2"

[dev-dependencies]
insta = "1.49.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
